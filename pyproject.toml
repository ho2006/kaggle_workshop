[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-playground-s6e8"
version = "0.1.0"
description = "Leakage-safe Stage 1 baselines for Kaggle Playground S6E8"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "catboost>=1.2",
  "xgboost>=2.0",
  "pyyaml>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "psutil>=5.9"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

