extends: configs/baseline.yaml
model:
  name: xgboost
  params:
    objective: binary:logistic
    eval_metric: auc
    learning_rate: 0.03
    n_estimators: 5000
    max_depth: 7
    min_child_weight: 10
    subsample: 0.9
    colsample_bytree: 0.9
    reg_alpha: 0.0
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
    tree_method: hist

